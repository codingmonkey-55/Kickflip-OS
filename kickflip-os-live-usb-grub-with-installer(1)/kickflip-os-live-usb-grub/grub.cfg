# Kickflip OS — Ubuntu live USB GRUB menu
# Replace the original live-USB GRUB menu configuration with this file
# only after verifying the paths used by your Ubuntu ISO.

set default=0
set timeout=10

insmod all_video
insmod gfxterm
insmod png

terminal_output gfxterm
set gfxmode=auto
set gfxpayload=keep

# Main Kickflip OS live session
menuentry "Kickflip OS" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

# Launch the installer/live environment
menuentry "Install Kickflip OS" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}

# Useful fallback for systems with graphics problems
menuentry "Kickflip OS — Safe Graphics" {
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}

# Memory test
menuentry "Memory Test (memtest86+)" {
    linux16 /boot/memtest86+.bin
}

menuentry "Memory Test (memtest86+, serial console)" {
    linux16 /boot/memtest86+.bin console=ttyS0,115200n8
}

menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
